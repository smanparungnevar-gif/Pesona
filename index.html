<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Count Pemilihan OSIS & MPK - Google Sheets Enabled</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: { 50: '#eff6ff', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' },
                        osis: { 500: '#0284c7', 600: '#0369a1' },
                        mpk: { 500: '#059669', 600: '#047857' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen font-sans flex flex-col">

    <!-- Top Header Navigation -->
    <header class="bg-slate-900 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-lg bg-blue-600 flex items-center justify-center font-bold text-xl shadow-inner">
                    <i class="fa-solid fa-chart-column text-sky-300"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight">Quick Count OSIS & MPK</h1>
                    <p class="text-xs text-slate-400">Hasil Perolehan Suara Real-time</p>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-1 w-full">
        <!-- DASHBOARD QUICK COUNT ONLY -->
        <section id="sec-dashboard" class="space-y-6">
            <!-- Summary Metric Cards -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                    <div>
                        <p class="text-xs font-semibold uppercase text-slate-400">Total Suara OSIS</p>
                        <h3 id="stat-total-osis" class="text-3xl font-extrabold text-slate-800 mt-1">0</h3>
                        <p class="text-xs text-slate-500 mt-1">Suara sah masuk</p>
                    </div>
                    <div class="w-12 h-12 bg-sky-50 text-sky-600 rounded-xl flex items-center justify-center text-xl">
                        <i class="fa-solid fa-user-tie"></i>
                    </div>
                </div>
                <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                    <div>
                        <p class="text-xs font-semibold uppercase text-slate-400">Total Suara MPK</p>
                        <h3 id="stat-total-mpk" class="text-3xl font-extrabold text-slate-800 mt-1">0</h3>
                        <p class="text-xs text-slate-500 mt-1">Suara sah masuk</p>
                    </div>
                    <div class="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-xl flex items-center justify-center text-xl">
                        <i class="fa-solid fa-users"></i>
                    </div>
                </div>
                <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                    <div>
                        <p class="text-xs font-semibold uppercase text-slate-400">Unggul Sementara OSIS</p>
                        <h3 id="stat-lead-osis" class="text-lg font-bold text-sky-700 mt-1 truncate max-w-[150px]">-</h3>
                        <p id="stat-lead-osis-pct" class="text-xs text-slate-500 mt-1">0%</p>
                    </div>
                    <div class="w-12 h-12 bg-amber-50 text-amber-600 rounded-xl flex items-center justify-center text-xl">
                        <i class="fa-solid fa-trophy"></i>
                    </div>
                </div>
                <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                    <div>
                        <p class="text-xs font-semibold uppercase text-slate-400">Unggul Sementara MPK</p>
                        <h3 id="stat-lead-mpk" class="text-lg font-bold text-emerald-700 mt-1 truncate max-w-[150px]">-</h3>
                        <p id="stat-lead-mpk-pct" class="text-xs text-slate-500 mt-1">0%</p>
                    </div>
                    <div class="w-12 h-12 bg-purple-50 text-purple-600 rounded-xl flex items-center justify-center text-xl">
                        <i class="fa-solid fa-award"></i>
                    </div>
                </div>
            </div>

            <!-- Charts & Details Grid -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <!-- OSIS Section -->
                <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                    <div class="flex justify-between items-center border-b pb-3 border-slate-100">
                        <div class="flex items-center space-x-2">
                            <span class="w-3 h-3 rounded-full bg-sky-500"></span>
                            <h2 class="font-bold text-slate-800 text-lg">Hasil Pemilihan OSIS</h2>
                        </div>
                        <span class="text-xs font-semibold bg-sky-100 text-sky-800 px-2.5 py-1 rounded-full">Ketua & Wakil</span>
                    </div>

                    <div class="h-64 relative flex items-center justify-center">
                        <canvas id="chartOsis"></canvas>
                    </div>

                    <div id="list-osis-bars" class="space-y-3 pt-2">
                        <!-- Dynamic Candidate Progress Bars -->
                    </div>
                </div>

                <!-- MPK Section -->
                <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                    <div class="flex justify-between items-center border-b pb-3 border-slate-100">
                        <div class="flex items-center space-x-2">
                            <span class="w-3 h-3 rounded-full bg-emerald-500"></span>
                            <h2 class="font-bold text-slate-800 text-lg">Hasil Pemilihan MPK</h2>
                        </div>
                        <span class="text-xs font-semibold bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-full">Majelis Perwakilan Kelas</span>
                    </div>

                    <div class="h-64 relative flex items-center justify-center">
                        <canvas id="chartMpk"></canvas>
                    </div>

                    <div id="list-mpk-bars" class="space-y-3 pt-2">
                        <!-- Dynamic Candidate Progress Bars -->
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script>
        // App State (Data Tampilan)
        let state = {
            candidates: {
                osis: [
                    { id: 1, tag: "OSIS #1", nama: "Robert Cornellius Sitorus", suara: 145, foto: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80" },
                    { id: 2, tag: "OSIS #2", nama: "Citra & Dewi", suara: 162, foto: "https://images.unsplash.com/photo-1517841905240-472988babdf9?w=150&auto=format&fit=crop&q=80" }
                ],
                mpk: [
                    { id: 1, tag: "MPK #1", nama: "Eka Prasetya", suara: 90, foto: "https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?w=150&auto=format&fit=crop&q=80" },
                    { id: 2, tag: "MPK #2", nama: "Farhan Razi", suara: 148, foto: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150&auto=format&fit=crop&q=80" },
                    { id: 3, tag: "MPK #3", nama: "Gita Gutawa", suara: 85, foto: "https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=150&auto=format&fit=crop&q=80" }
                ]
            }
        };

        let chartOsisInstance = null;
        let chartMpkInstance = null;

        window.onload = function() {
            renderDashboard();
        };

        function renderDashboard() {
            renderMetrics();
            renderCharts();
        }

        function renderMetrics() {
            const totalOsis = state.candidates.osis.reduce((sum, c) => sum + c.suara, 0);
            const totalMpk = state.candidates.mpk.reduce((sum, c) => sum + c.suara, 0);

            document.getElementById('stat-total-osis').innerText = totalOsis.toLocaleString('id-ID');
            document.getElementById('stat-total-mpk').innerText = totalMpk.toLocaleString('id-ID');

            // Unggul Sementara OSIS
            const leadOsis = [...state.candidates.osis].sort((a,b) => b.suara - a.suara)[0];
            if (leadOsis && totalOsis > 0) {
                const pct = ((leadOsis.suara / totalOsis) * 100).toFixed(1);
                document.getElementById('stat-lead-osis').innerText = leadOsis.nama;
                document.getElementById('stat-lead-osis-pct').innerText = `${pct}% (${leadOsis.suara} Suara)`;
            }

            // Unggul Sementara MPK
            const leadMpk = [...state.candidates.mpk].sort((a,b) => b.suara - a.suara)[0];
            if (leadMpk && totalMpk > 0) {
                const pct = ((leadMpk.suara / totalMpk) * 100).toFixed(1);
                document.getElementById('stat-lead-mpk').innerText = leadMpk.nama;
                document.getElementById('stat-lead-mpk-pct').innerText = `${pct}% (${leadMpk.suara} Suara)`;
            }

            // Progress Bar OSIS
            const osisBarsContainer = document.getElementById('list-osis-bars');
            osisBarsContainer.innerHTML = '';
            state.candidates.osis.forEach(c => {
                const pct = totalOsis > 0 ? ((c.suara / totalOsis) * 100).toFixed(1) : "0.0";
                osisBarsContainer.innerHTML += `
                    <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex items-center space-x-4">
                        <img src="${c.foto}" alt="${c.nama}" class="w-16 h-16 sm:w-20 sm:h-20 rounded-xl object-cover bg-blue-600 flex-shrink-0 border border-slate-100" onerror="this.src='https://placehold.co/100x100/e2e8f0/475569?text=Foto'">
                        <div class="flex-1 min-w-0 space-y-1">
                            <span class="inline-block px-2.5 py-0.5 bg-blue-100 text-blue-600 rounded-full text-xs font-bold tracking-wide">${c.tag || 'OSIS #' + c.id}</span>
                            <h3 class="font-bold text-slate-900 text-base sm:text-lg truncate leading-tight">${c.nama}</h3>
                            <div class="flex justify-between items-center text-sm pt-0.5">
                                <span class="text-slate-500 font-medium">${c.suara} Suara</span>
                                <span class="font-bold text-blue-600 text-base sm:text-lg">${pct}%</span>
                            </div>
                            <div class="w-full bg-slate-100 rounded-full h-3 overflow-hidden mt-1">
                                <div class="bg-blue-600 h-full rounded-full transition-all duration-500" style="width: ${pct}%"></div>
                            </div>
                        </div>
                    </div>
                `;
            });

            // Progress Bar MPK
            const mpkBarsContainer = document.getElementById('list-mpk-bars');
            mpkBarsContainer.innerHTML = '';
            state.candidates.mpk.forEach(c => {
                const pct = totalMpk > 0 ? ((c.suara / totalMpk) * 100).toFixed(1) : "0.0";
                mpkBarsContainer.innerHTML += `
                    <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex items-center space-x-4">
                        <img src="${c.foto}" alt="${c.nama}" class="w-16 h-16 sm:w-20 sm:h-20 rounded-xl object-cover bg-emerald-600 flex-shrink-0 border border-slate-100" onerror="this.src='https://placehold.co/100x100/e2e8f0/475569?text=Foto'">
                        <div class="flex-1 min-w-0 space-y-1">
                            <span class="inline-block px-2.5 py-0.5 bg-emerald-100 text-emerald-700 rounded-full text-xs font-bold tracking-wide">${c.tag || 'MPK #' + c.id}</span>
                            <h3 class="font-bold text-slate-900 text-base sm:text-lg truncate leading-tight">${c.nama}</h3>
                            <div class="flex justify-between items-center text-sm pt-0.5">
                                <span class="text-slate-500 font-medium">${c.suara} Suara</span>
                                <span class="font-bold text-emerald-600 text-base sm:text-lg">${pct}%</span>
                            </div>
                            <div class="w-full bg-slate-100 rounded-full h-3 overflow-hidden mt-1">
                                <div class="bg-emerald-600 h-full rounded-full transition-all duration-500" style="width: ${pct}%"></div>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function renderCharts() {
            // Chart OSIS
            const osisCtx = document.getElementById('chartOsis').getContext('2d');
            const osisLabels = state.candidates.osis.map(c => c.nama);
            const osisData = state.candidates.osis.map(c => c.suara);

            if (chartOsisInstance) chartOsisInstance.destroy();

            chartOsisInstance = new Chart(osisCtx, {
                type: 'doughnut',
                data: {
                    labels: osisLabels,
                    datasets: [{
                        data: osisData,
                        backgroundColor: ['#0284c7', '#38bdf8', '#7dd3fc', '#bae6fd'],
                        borderWidth: 2,
                        borderColor: '#ffffff'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom', labels: { font: { family: 'Inter', size: 12 } } }
                    }
                }
            });

            // Chart MPK
            const mpkCtx = document.getElementById('chartMpk').getContext('2d');
            const mpkLabels = state.candidates.mpk.map(c => c.nama);
            const mpkData = state.candidates.mpk.map(c => c.suara);

            if (chartMpkInstance) chartMpkInstance.destroy();

            chartMpkInstance = new Chart(mpkCtx, {
                type: 'doughnut',
                data: {
                    labels: mpkLabels,
                    datasets: [{
                        data: mpkData,
                        backgroundColor: ['#059669', '#34d399', '#6ee7b7', '#a7f3d0'],
                        borderWidth: 2,
                        borderColor: '#ffffff'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom', labels: { font: { family: 'Inter', size: 12 } } }
                    }
                }
            });
        }
    </script>
</body>
</html>
